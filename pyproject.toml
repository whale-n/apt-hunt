[project]
name = "apt-hunt"
version = "0.1.0"
description = "North Williamsburg apartment hunt: alert ingest, scoring, Notion sync, local tracker UI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
